[pytest]
# Put the project root (this dir) on sys.path so tests can `import src.*`.
# tests/unit is a package but tests/ is not, so pytest's default import mode
# would otherwise only add tests/ to the path — never the project root.
pythonpath = .

# asyncio_mode=auto lets plain `async def test_*` functions run without an explicit
# @pytest.mark.asyncio on every one (the suite relies on this).
asyncio_mode = auto

# Collect the whole hermetic suite. This was previously an explicit two-entry
# allowlist (tests/test_exchange_contract.py + tests/unit), which silently excluded
# ~17 files at tests/ root — including test_multi_user.py (tenancy) and
# test_oco_management.py (money safety) — and would silently exclude every new file
# added there. A gate that quietly skips 97 tests reports false confidence.
#
# The integration suite under tests/integration needs live Redis/Postgres and stays
# opt-in via `pytest tests/integration`; norecursedirs keeps it out of the default
# run without blocking that explicit invocation.
#
# Service-dependent tests OUTSIDE tests/integration must skip when their service is
# absent, not fail (see tests/test_message_bus_integration.py).
testpaths =
    tests

norecursedirs = tests/integration *.egg .* _darcs build CVS dist node_modules venv {arch}

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Keep output readable in CI logs.
addopts = -ra --strict-markers

markers =
    integration: tests that require live Redis/Postgres service containers
    slow: long-running tests (used by tests/integration)
