[pytest]
# asyncio_mode=auto lets plain `async def test_*` functions run without an explicit
# @pytest.mark.asyncio on every one (the suite relies on this).
asyncio_mode = auto

# Default to the fast, hermetic tests in CI: the exchange contract test and the
# fully-mocked unit suite (no live Redis/Postgres needed). The integration suite
# lives under tests/integration and is opt-in via `pytest tests/integration`.
testpaths =
    tests/test_exchange_contract.py
    tests/unit

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Keep output readable in CI logs.
addopts = -ra --strict-markers

markers =
    integration: tests that require live Redis/Postgres service containers
