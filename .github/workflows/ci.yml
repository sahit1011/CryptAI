name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto-trading-agent

    # Service containers for the opt-in integration suite. The default test step
    # (contract + unit) uses mocked Redis/Postgres and does not touch these, but
    # they are wired up and reachable on localhost for `tests/integration`.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trading_agent
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: secure_password_here
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trader -d trading_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test-only configuration. No real secrets — keeps fail-closed gates off and
      # points the integration suite at the service containers above.
      ENVIRONMENT: test
      LOG_LEVEL: WARNING
      REDIS_URL: redis://localhost:6379
      POSTGRES_URL: postgresql://trader:secure_password_here@localhost:5432/trading_agent
      USE_TESTNET: "true"
      ENABLE_EXECUTION: "false"
      LIVE_TRADING_CONFIRMED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crypto-trading-agent/requirements-dev.txt

      - name: Install TA-Lib C library
        run: |
          set -euo pipefail
          sudo apt-get update
          # Build the TA-Lib C library from source — the Python `ta-lib` wheel needs
          # the native headers/libs present at install time.
          curl -fsSL -o /tmp/ta-lib.tar.gz \
            https://github.com/ta-lib/ta-lib/releases/download/v0.4.0/ta-lib-0.4.0-src.tar.gz
          tar -xzf /tmp/ta-lib.tar.gz -C /tmp
          cd /tmp/ta-lib
          ./configure --prefix=/usr
          make
          sudo make install
          sudo ldconfig

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          # NumPy must be present before building the ta-lib Python wheel.
          pip install "numpy>=1.26.4"
          pip install -r requirements-dev.txt

      - name: Lint (flake8, curated)
        # Non-blocking gate: surface lint output but don't fail the build on the
        # large existing codebase. Tighten by removing `|| true` once it's clean.
        run: |
          flake8 src tests || true

      - name: Backend import / boot smoke
        # Fail fast if the API server module can't even be imported (catches broken
        # imports, syntax errors, and bad top-level side effects). Does NOT start a
        # server or open any sockets.
        run: |
          python -c "import src.api.server; print('src.api.server imported OK')"

      - name: Run tests (contract + unit)
        # testpaths in pytest.ini scopes this to tests/test_exchange_contract.py and
        # tests/unit (asyncio_mode=auto runs the async tests). Coverage is reported
        # for src but not enforced as a gate here.
        run: |
          pytest --cov=src --cov-report=term-missing

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits, not just the tip.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      # Public build-time values. The dashboard inlines NEXT_PUBLIC_* at build; these
      # placeholders let `next build` complete without real Supabase credentials.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
